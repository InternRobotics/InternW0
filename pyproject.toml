[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "w0"
version = "0.1.0"
description = "W0: domain-conditioned asynchronous world-action modeling"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "boto3==1.35.99",
  "datasets==3.6.0",
  "deepspeed==0.18.7",
  "einops==0.8.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.36.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "jsonlines==4.0.0",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "pyarrow==23.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "termcolor==2.5.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchcodec==0.5",
  "tqdm==4.66.5",
  "transformers==4.57.6",
  "typing-extensions==4.15.0",
  "wandb",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["w0*"]
